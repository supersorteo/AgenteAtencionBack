spring.application.name=agente-atencion
spring.config.import=optional:file:./.env[.properties]

# Cache (Caffeine): tamaño y vida de cada cache en config/CacheConfig.java
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Cloudinary — setear en producción; vacíos = almacenamiento local
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
server.port=8080


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Flyway — migraciones versionadas en db/migration/
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT — requerido en todos los entornos; setear en .env local o en Railway
app.jwt.secret=${APP_JWT_SECRET}


app.superadmin.username=${SUPERADMIN_USERNAME}
app.superadmin.password=${SUPERADMIN_PASSWORD}
app.superadmin2.username=${SUPERADMIN2_USERNAME}
app.superadmin2.password=${SUPERADMIN2_PASSWORD}

# ── Pagos ────────────────────────────────────────────────────────────────────
# Credenciales con default vacío: si falta la variable la app igual arranca (y los tests también);
# con enabled=true y credenciales vacías, el endpoint de pago responde 503.
pagos.backend-url=${APP_BACKEND_URL:http://localhost:8080}

# Mercado Pago: sandbox y live usan el mismo host. El modo lo define el Access Token:
# en local (.env) van las credenciales de PRUEBA del vendedor de prueba; PayPal sí cambia de host.
mercadopago.enabled=${MP_ENABLED:true}
mercadopago.base-url=${MP_BASE_URL:https://api.mercadopago.com}
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.success-url=${MP_SUCCESS_URL:${APP_PUBLIC_URL:http://localhost:4200}/pago/resultado}
mercadopago.failure-url=${MP_FAILURE_URL:${APP_PUBLIC_URL:http://localhost:4200}/pago/resultado}
mercadopago.pending-url=${MP_PENDING_URL:${APP_PUBLIC_URL:http://localhost:4200}/pago/resultado}

paypal.enabled=${PAYPAL_ENABLED:true}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.success-url=${PAYPAL_SUCCESS_URL:${APP_PUBLIC_URL:http://localhost:4200}/pago/resultado}
paypal.cancel-url=${PAYPAL_CANCEL_URL:${APP_PUBLIC_URL:http://localhost:4200}/pago/resultado}

# Spring AI - Groq
spring.ai.openai.api-key=${GROQ_API_KEY:${GROQ_KEY}}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.model=${GROQ_MODEL:qwen/qwen3.8-27b}
spring.ai.openai.chat.options.max-tokens=800
spring.ai.openai.timeout=${GROQ_TIMEOUT:30s}
spring.ai.openai.max-retries=${GROQ_MAX_RETRIES:1}
chat.timeout-segundos=${CHAT_TIMEOUT:35}
chat.habilitado=${CHAT_ENABLED:true}
chat.max-concurrentes=${CHAT_MAX_CONCURRENTES:20}
chat.max-mensajes-dia=${CHAT_MAX_MENSAJES_DIA:500}
