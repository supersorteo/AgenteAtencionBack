server.port=${PORT:8080}
server.forward-headers-strategy=NATIVE

# ── Base de datos ──────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.threads.virtual.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Flyway — auto-config desactivada; FlywayConfig.java inicializa el bean manualmente
spring.flyway.enabled=false
spring.jpa.open-in-view=false

# ── Seguridad JWT (sin default: la app no arranca si no esta seteada) ──────
app.jwt.secret=${APP_JWT_SECRET}

# ── Pagos (credenciales LIVE, se cargan en las Variables de Railway) ────────
# Sin default de credenciales: si faltan, la app arranca y los endpoints de pago responden 503.
# Sin default de URLs ni de sandbox: nunca debe redirigir a localhost ni cobrar contra sandbox en produccion.
pagos.backend-url=${APP_BACKEND_URL:https://agenteatencionback-production.up.railway.app}


# enabled=false por defecto: el cobro real se activa a propósito con MP_ENABLED / PAYPAL_ENABLED=true
# Mercado Pago: mismo host que en local; aqui el Access Token debe ser el de PRODUCCION (Railway).
mercadopago.enabled=${MP_ENABLED:true}
mercadopago.base-url=${MP_BASE_URL:https://api.mercadopago.com}
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.success-url=${MP_SUCCESS_URL:${APP_PUBLIC_URL:}/pago/resultado}
mercadopago.failure-url=${MP_FAILURE_URL:${APP_PUBLIC_URL:}/pago/resultado}
mercadopago.pending-url=${MP_PENDING_URL:${APP_PUBLIC_URL:}/pago/resultado}

paypal.enabled=${PAYPAL_ENABLED:true}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
#paypal.base-url=${PAYPAL_BASE_URL:https://api-m.paypal.com}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.success-url=${PAYPAL_SUCCESS_URL:${APP_PUBLIC_URL:}/pago/resultado}
paypal.cancel-url=${PAYPAL_CANCEL_URL:${APP_PUBLIC_URL:}/pago/resultado}

# ── Spring AI / Groq ────────────────────────────────────────────────────────
# GROQ_API_KEY takes precedence; GROQ_KEY remains supported for Railway.
# spring.ai.openai.chat.options.model=qwen/qwen3.8-27b  ← sobrescribir con GROQ_MODEL si se necesita otro
spring.ai.openai.chat.options.model=${GROQ_MODEL:qwen/qwen3.8-27b}

# ── Cloudinary (uploads de imagenes en produccion) ──────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Multipart ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Logs ─────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.agente.atencion=INFO

