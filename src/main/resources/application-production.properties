server.port=${PORT:8080}

# ── Base de datos ──────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ── Seguridad JWT (sin default: la app no arranca si no esta seteada) ──────
app.jwt.secret=${APP_JWT_SECRET}

# ── Spring AI / Groq ────────────────────────────────────────────────────────
# Inherits the shared Groq configuration from application.properties.
# GROQ_API_KEY takes precedence; GROQ_KEY remains supported for Railway.
# Set GROQ_MODEL to override the shared model.

# ── Cloudinary (uploads de imagenes en produccion) ──────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Multipart ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# ── Logs ─────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.agente.atencion=INFO
