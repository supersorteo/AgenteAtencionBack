spring.application.name=agente-atencion
spring.config.import=optional:file:./.env[.properties]

# Cache (Caffeine) — max 200 entradas por cache, expira 5 min sin escritura
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=5m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Cloudinary — setear en producción; vacíos = almacenamiento local
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
server.port=8080


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Flyway — migraciones versionadas en db/migration/
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT — requerido en todos los entornos; setear en .env local o en Railway
app.jwt.secret=${APP_JWT_SECRET}


app.superadmin.username=${SUPERADMIN_USERNAME}
app.superadmin.password=${SUPERADMIN_PASSWORD}
app.superadmin2.username=${SUPERADMIN2_USERNAME}
app.superadmin2.password=${SUPERADMIN2_PASSWORD}

# Spring AI - Groq
spring.ai.openai.api-key=${GROQ_API_KEY:${GROQ_KEY}}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.model=${GROQ_MODEL:qwen/qwen3.8-27b}
spring.ai.openai.chat.options.max-tokens=800
