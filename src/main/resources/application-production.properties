server.port=${PORT:8080}

# ── Base de datos ──────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ── Seguridad JWT (sin default: la app no arranca si no esta seteada) ──────
app.jwt.secret=${APP_JWT_SECRET}

# ── Spring AI / Groq ────────────────────────────────────────────────────────
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=qwen/qwen3-27b
spring.ai.openai.chat.options.max-tokens=800

# ── Cloudinary (uploads de imagenes en produccion) ──────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Multipart ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# ── Logs ─────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.barberia=INFO
