spring.application.name=agente-atencion
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Cloudinary — setear en producción; vacíos = almacenamiento local
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/Agentes
spring.datasource.username=postgres
spring.datasource.password=Tanque.123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT — en producción setear APP_JWT_SECRET como variable de entorno
app.jwt.secret=${APP_JWT_SECRET:elcorte-local-dev-only-change-in-prod-!!}

# Spring AI - Groq
spring.ai.openai.api-key=${GROQ_API_KEY:${GROQ_KEY}}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# spring.ai.openai.chat.options.model=${GROQ_MODEL:qwen/qwen3.8-27b}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.max-tokens=800
