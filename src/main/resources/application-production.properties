server.port=${PORT:8080}
server.forward-headers-strategy=NATIVE

# ── Base de datos ──────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Flyway — auto-config desactivada; FlywayConfig.java inicializa el bean manualmente
spring.flyway.enabled=false
spring.jpa.open-in-view=false

# ── Seguridad JWT (sin default: la app no arranca si no esta seteada) ──────
app.jwt.secret=${APP_JWT_SECRET}

# ── Spring AI / Groq ────────────────────────────────────────────────────────
# GROQ_API_KEY takes precedence; GROQ_KEY remains supported for Railway.
# spring.ai.openai.chat.options.model=qwen/qwen3.8-27b  ← sobrescribir con GROQ_MODEL si se necesita otro
spring.ai.openai.chat.options.model=${GROQ_MODEL:qwen/qwen3.8-27b}

# ── Cloudinary (uploads de imagenes en produccion) ──────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Multipart ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# ── Logs ─────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.agente.atencion=INFO
logging.level.org.flywaydb=INFO
